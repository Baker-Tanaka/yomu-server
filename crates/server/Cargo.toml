[package]
name = "paper-reader-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
paper-reader-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip", "compression-br"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
ammonia = "4.2.5"
scraper = "0.29.0"
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.105"
thiserror = "2.0.21"
sha2 = "0.11.1"
url = "2.5.9"
dotenvy = "0.15.7"
