[package]
name = "paper-reader-web"
version.workspace = true
edition.workspace = true
license.workspace = true

# wasm32-unknown-unknown 専用。ネイティブでは空の main だけをビルドする。
[target.'cfg(target_arch = "wasm32")'.dependencies]
paper-reader-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
log = "0.4.35"
web-sys = { version = "0.3.107", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Node",
  "Selection", "Range", "Event", "EventTarget", "Request", "RequestInit", "Response", "Headers",
  "AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader",
  "TextDecoder", "TextDecodeOptions",
  "KeyboardEvent", "PointerEvent", "MouseEvent", "Storage", "DomRect", "DomTokenList",
  "CssStyleDeclaration", "MediaQueryList", "ResizeObserver", "DomRectList", "HtmlInputElement",
  "Text", "CharacterData", "NodeList", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition",
  "DocumentFragment", "Navigator", "Clipboard", "SpeechSynthesis", "SpeechSynthesisUtterance",
  "Touch", "TouchEvent", "TouchList", "AddEventListenerOptions", "VisualViewport",
] }
