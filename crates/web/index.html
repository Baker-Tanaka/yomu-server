<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>論文リーダー</title>
  <meta name="color-scheme" content="light dark" />
  <script>
    // wasm の読み込み前に保存済みの配色を当て、白い画面が一瞬出るのを防ぐ（dom.rs の THEME_STORAGE_KEY と同じキー）
    try {
      var t = localStorage.getItem("paper-reader.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="paper-reader-web" data-wasm-opt="z" />
  <link data-trunk rel="css" href="assets/paper.css" />
</head>
<body>
  <div id="layout">
    <main id="paper" lang="en">
      <div class="paper-placeholder" lang="ja">
        <span class="hero-badge">arXiv × ローカル LLM</span>
        <h1>英語論文を、<br /><span class="accent">その場で読み解く。</span></h1>
        <p class="lead">単語は辞書ですぐに、英文は和訳・文構造・文法まで。すべてこの Mac の中で動きます。</p>
        <ol class="steps">
          <li><b>論文を開く</b><span>解説パネルの欄に arXiv の URL・ID、またはキーワードを入れて検索</span></li>
          <li><b>選ぶ</b><span>単語はダブルクリック、英文はドラッグ（iPhone は長押し）</span></li>
          <li><b>読み解く</b><span><kbd>E</kbd> で解説、<kbd>Esc</kbd> で選択解除</span></li>
        </ol>
      </div>
    </main>
    <div id="splitter" role="separator" tabindex="0" aria-orientation="vertical"
         aria-valuemin="20" aria-valuemax="80" aria-valuenow="60"
         aria-label="ペインの境界（ドラッグで幅を変更、ダブルクリックで元に戻す）"
         title="ドラッグで幅を変更（ダブルクリックで元に戻す）"></div>
    <aside id="explain-pane">
      <canvas id="egui_canvas"></canvas>
    </aside>
  </div>
</body>
</html>
