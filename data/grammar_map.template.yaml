# 講座のレッスンと文法タグの対応（テンプレート。リポジトリで管理）
#
# 使い方:
#   cp data/grammar_map.template.yaml data/grammar_map.local.yaml
#   を作り、grammar_map.local.yaml に自分が受講しているレッスンを書き写す（local は git 管理外）。
#   local が無いあいだはこのテンプレートを読み、レッスンは空としてカテゴリ単位の案内だけを出す。
#
# 書き写してよいのは「レッスンのタイトル」だけ。講座の解説文・動画・テキストの内容は書かない
# （このファイルの内容は LLM のプロンプトにも入らない）。
#
# 各レッスン:
#   id:       レッスンの ID（英数字・ハイフン。自由に付けてよい、重複不可）
#   category: 下の category と同じ値
#   title:    レッスンのタイトル（自分で書き写す）
#   tags:     data/grammar_tags.yaml の id の配列
#
# 「講座の範囲内・外」の判定:
#   - レッスンが 1 つも書かれていないカテゴリのタグは「カテゴリ単位の案内」を出す
#   - レッスンが書かれたカテゴリで、どのレッスンからも参照されていないタグは「講座の範囲外」
#   - 「論文構文」カテゴリのタグは常に範囲外

course: スタディサプリENGLISH TOEIC対策コース「パーフェクト講義 英文法編」
